# Carbure with MariaDB, from the docker/ directory: docker compose pull && docker compose up -d,
# then open http://localhost:8080/ and follow the installation wizard (everything is filled in).
# Another published port: CARBURE_PORT in docker/.env (CARBURE_PORT=8090 when 8080 is taken).
# pull first: with both image and build, Compose would build the image from this clone (build
# is kept for the CI and ./start.sh) instead of using the published release.
# Optional: choose the database password in docker/.env (DB_PASSWORD=...).
# The data of Carbure (configuration, logs, banks) is in the data/ directory of the project.
services:
  carbure:
    image: ltoinel/carbure:latest
    build:
      # The build context is the root of the project
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${CARBURE_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: carbure
      DB_USER: carbure
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      # Language suggested by the installation wizard (fr, en)
      LANGUAGE: fr
      # Published port, given in the message of the first start
      CARBURE_PORT: ${CARBURE_PORT:-8080}
      # Daily bank synchronization (seconds); remove to disable
      SYNC_INTERVAL: 86400
      # Reverse proxies whose X-Forwarded-For gives the address of the client (rate limit
      # of the logins, logs). Unset: private networks and loopback; "none": no proxy
      # (Carbure published directly). See docs/securite.md
      # TRUSTED_PROXIES: 172.16.0.0/12
      # Patch creditmutuel module for FormNotFound issue (set to TRUE to enable)
      # See: https://gitlab.com/woob/woob/-/issues/829
      # PATCH_CREDITMUT: TRUE
    volumes:
      - ../data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:13
    environment:
      MARIADB_DATABASE: carbure
      MARIADB_USER: carbure
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      # A new major version of MariaDB (image updated by docker compose pull) upgrades
      # the existing database when it starts (mariadb-upgrade); nothing to do otherwise
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - carbure-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  carbure-db:
